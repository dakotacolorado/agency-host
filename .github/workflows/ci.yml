name: CI

# A binary is installed, not deployed, so there is no moment when every machine
# runs the new one; a release is only what a machine may take next. So one
# workflow carries a change the whole way: checked, built for every target, run
# against the beta service, and only then -- on a merge -- published. Nothing
# orders two workflows, so splitting this would let a release race its checks.
# `vars.AWS_DEPLOY_ROLE` is the OIDC role from the aws-infra repo.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # The session tests run a stand-in agent under real tmux, since tmux is
      # what gives an agent the terminal it needs to be spoken to.
      - run: command -v tmux || (sudo apt-get update -q && sudo apt-get install -y -q tmux)
      - run: cargo test --locked

  build:
    needs: checks
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # zig is the C cross-compiler for ring, which rustls needs; it lets one
      # runner build both linux targets against musl without a sysroot each.
      - if: runner.os == 'Linux'
        run: |
          pip install ziglang==0.17.0
          cargo install --locked cargo-zigbuild@0.24.0
          cargo zigbuild --release --locked --target ${{ matrix.target }}
      - if: runner.os == 'macOS'
        run: cargo build --release --locked --target ${{ matrix.target }}

      # Copying the file is the whole install, so it must need nothing the
      # machine does not already have: no loader or libc on linux, and only the
      # system libraries every mac ships on macOS.
      - name: Needs nothing on the machine
        run: |
          bin=target/${{ matrix.target }}/release/agent-host
          if [ "$RUNNER_OS" = Linux ]; then
            file "$bin" | tee /dev/stderr | grep -q 'statically linked'
          else
            otool -L "$bin" | tail -n +2 | tee /dev/stderr | grep -v '^[[:space:]]*/usr/lib/' && exit 1 || true
          fi
      - name: Runs on a bare machine
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: docker run --rm -v "$PWD/target/${{ matrix.target }}/release:/b:ro" busybox /b/agent-host --version
      - name: Runs here
        if: matrix.target == 'aarch64-apple-darwin'
        run: target/${{ matrix.target }}/release/agent-host --version

      - run: cp target/${{ matrix.target }}/release/agent-host agent-host-${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: agent-host-${{ matrix.target }}
          path: agent-host-${{ matrix.target }}
          if-no-files-found: error

  # Nothing but the built binary talking to the real service proves the two
  # halves agree, so this runs the artifact itself, not `cargo run`.
  integration:
    needs: build
    # Whether this can prove anything depends on there being a beat endpoint to
    # beat against, so that is what it asks: until beta exists, answers, and
    # serves the beat, it passes unproved with a line naming what it waited for
    # (see scripts/beat-cycle.sh). Red for a dependency still to come teaches
    # people to ignore red. Either way release does not run.
    runs-on: ubuntu-latest
    outputs:
      proved: ${{ steps.cycle.outputs.proved }}
    permissions:
      id-token: write # required to assume the role via OIDC
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: agent-host-x86_64-unknown-linux-musl
      - run: chmod +x agent-host-x86_64-unknown-linux-musl
      - if: vars.AWS_DEPLOY_ROLE != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE }}
          aws-region: us-east-1
      - name: A whole beat cycle against beta
        id: cycle
        env:
          AWS_DEPLOY_ROLE: ${{ vars.AWS_DEPLOY_ROLE }}
        run: |
          if [ -z "$AWS_DEPLOY_ROLE" ]; then
            echo "::warning::skipped: waiting for vars.AWS_DEPLOY_ROLE to look up beta with; nothing will be released"
            echo "proved=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # describe-stacks fails for a stack not deployed yet, and prints None
          # for one without the output: both mean beta is still to come.
          AGENT_HOST_SERVICE_URL=$(aws cloudformation describe-stacks --stack-name AgentService-beta \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" --output text) || AGENT_HOST_SERVICE_URL=
          [ "$AGENT_HOST_SERVICE_URL" = None ] && AGENT_HOST_SERVICE_URL=
          if [ -z "$AGENT_HOST_SERVICE_URL" ]; then
            echo "::warning::skipped: waiting for stack AgentService-beta with an ApiUrl output; nothing will be released"
            echo "proved=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          AGENT_HOST_TOKEN=$(aws secretsmanager get-secret-value \
            --secret-id agent-service/beta/api-token --query SecretString --output text)
          echo "::add-mask::$AGENT_HOST_TOKEN"
          export AGENT_HOST_SERVICE_URL AGENT_HOST_TOKEN
          export AGENT_HOST_ID="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          scripts/beat-cycle.sh ./agent-host-x86_64-unknown-linux-musl

  release:
    needs: integration
    # Green is not enough: until beta serves the beat, integration passes
    # without proving anything, and that must not publish.
    if: github.event_name == 'push' && needs.integration.outputs.proved == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Two merges in quick succession must not publish out of order.
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: agent-host-*
          merge-multiple: true
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          tag="v${version}-${GITHUB_RUN_NUMBER}"
          chmod +x dist/agent-host-*
          (cd dist && sha256sum agent-host-* > SHA256SUMS)
          gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "agent-host $tag" \
            --notes "Install by copying the binary for this machine's target onto its PATH. See the README."
