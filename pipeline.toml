# worker-host's release (approval-service docs/PIPELINE.md); each job is in jobs.toml.
# It is a binary each machine installs from the GitHub release marked Latest, so
# prod is publishing that release, and beta is the beta test: the binary run as
# a host of its own against worker-service's beta for as long as the test runs.
version = 1
# The host speaks worker-service's protocol, whose shapes are the authority, and
# the beta test drives worker-service's beta.
after = ["dakotacolorado/worker-service"]

[steps]
build = "build"
unit-test = ["test", "clippy", "fmt"]
deploy-beta = "beta-test"
deploy-prod = "release"
integration-test-prod = "check-prod"
# Run at the good release's commit: makes that release Latest again.
rollback-prod = "rollback"

[skip]
integration-test-beta = "deploy-beta is the beta test itself: its host runs only while the test does, so nothing is left on beta to test after it."
rollback-beta = "Nothing stays on beta to roll back: the beta test's host exits with the test, and there is no standing beta host."
